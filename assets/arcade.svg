<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220"><title>Play Catch the Commits — catch green commits, dodge red bugs</title><rect x="1" y="1" width="1198" height="218" rx="16" fill="#142019" stroke="#3d543d"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="44" fill="#bdf264" font-size="13" letter-spacing="3">BONUS TRACK / POCKET ARCADE</text><text x="36" y="98" fill="#f1f5ed" font-size="38" font-weight="700">Catch the commits.</text><text x="36" y="133" fill="#b7cbb5" font-size="18">30 seconds. Ship the green. Dodge the bugs.</text><text x="36" y="183" fill="#bdf264" font-size="17" font-weight="700">▶ PLAY A ROUND ↗</text><rect x="900" y="42" width="35" height="35" rx="6" fill="#bdf264"/><text x="918" y="67" text-anchor="middle" fill="#142019" font-size="25">+</text><rect x="1050" y="83" width="35" height="35" rx="6" fill="#ff9f91"/><text x="1067" y="109" text-anchor="middle" fill="#142019" font-size="25">×</text><rect x="886" y="161" width="100" height="24" rx="7" fill="#bdf264"/><text x="936" y="179" text-anchor="middle" fill="#142019" font-size="16" font-weight="700">git</text></g></svg>